<path d="M150,330 V380" fill="none" stroke="#222" stroke-width="2.4" stroke-linejoin="round"/>
<rect x="135" y="150" width="30" height="180" rx="4" fill="#eef2f6" stroke="#444" stroke-width="2"/>
