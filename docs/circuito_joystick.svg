<text x="120" y="268" text-anchor="end" font-size="11.5" font-weight="400" fill="#57606a">(10 kΩ)</text>
<path d="M240,240 H172" fill="none" stroke="#1f6feb" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M172,240 l12,-6 v12 z" fill="#1f6feb"/>
