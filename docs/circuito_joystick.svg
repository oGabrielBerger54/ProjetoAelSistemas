<text x="520" y="272" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b2a10">10 kΩ</text>
<path d="M555,240 H600" fill="none" stroke="#1b1f24" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="600" cy="240" r="6" fill="#1b1f24"/>
