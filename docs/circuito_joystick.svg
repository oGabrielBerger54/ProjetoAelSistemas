<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" width="1320" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1320" height="800" fill="#ffffff"/>
<text x="660.0" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f24">Circuito simplificado: do joystick ao XADC</text>
<text x="660.0" y="54" text-anchor="middle" font-size="13" fill="#57606a">Cada eixo é um potenciômetro de 3,3 V a 0 V, seguido de um divisor de tensão</text>
<rect x="30" y="70" width="800" height="360" rx="12" fill="#fbfbfa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="50" y="98" text-anchor="start" font-size="16" font-weight="700" fill="#1b1f24">Eixo X: VRx → AD3P</text>
<path d="M70,125 H780" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/>
<text x="70" y="117" text-anchor="start" font-size="12" font-weight="700" fill="#d62728">+3,3 V (do JXADC, pino 6)</text>
<path d="M70,380 H780" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
<text x="70" y="400" text-anchor="start" font-size="12" font-weight="700" fill="#222">GND (0 V)</text>
