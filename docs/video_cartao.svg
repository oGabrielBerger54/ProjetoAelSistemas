<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f24" >Como o vídeo fica no cartão</text>
<text x="550" y="56" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a" >A FPGA não lê o FAT: procura o setor do cabeçalho pela assinatura e lê os quadros em setores seguidos</text>
<text x="40" y="100" text-anchor="start" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1">CARTÃO, SETOR POR SETOR (1 setor = 512 bytes)</text>
<line x1="40" y1="108" x2="1060" y2="108" stroke="#d0d7de" stroke-width="2"/>
<rect x="40" y="130" width="150" height="70" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
<text x="115" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f24" >Setores 0, 1, 2…</text>
<text x="115" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >MBR, tabelas do FAT</text>
<rect x="190" y="130" width="150" height="70" rx="10" fill="#fff8e1" stroke="#b28704" stroke-width="2.5"/>
<text x="265" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#5d4500" >Cabeçalho</text>
<text x="265" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >1 setor</text>
<rect x="340" y="130" width="140" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
<text x="410" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1" >Quadro 0</text>
<text x="410" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >150 setores</text>
<rect x="480" y="130" width="140" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
<text x="550" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1" >Quadro 1</text>
<text x="550" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >150 setores</text>
<rect x="620" y="130" width="140" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
<text x="690" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1" >Quadro 2</text>
<text x="690" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >150 setores</text>
<rect x="760" y="130" width="140" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
<text x="830" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1" >…</text>
<text x="830" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" ></text>
<rect x="900" y="130" width="140" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
<text x="970" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1" >Último</text>
<text x="970" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >150 setores</text>
<text x="115" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >(o PC escreve isto)</text>
<text x="265" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#5d4500" >começa por AEL_HUD_VIDEO_V1</text>
<line x1="1040" y1="252" x2="410" y2="252" stroke="#0b7a75" stroke-width="2" marker-end="url(#ar)"/>
<text x="550" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#0b7a75" >no último quadro: CMD12 (para a leitura) e recomeça do quadro 0, em loop</text>
<text x="40" y="300" text-anchor="start" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1">CABEÇALHO (bytes)</text>
<line x1="40" y1="308" x2="520" y2="308" stroke="#d0d7de" stroke-width="2"/>
<rect x="40" y="322" width="90" height="26" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
<text x="85" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4500" >0–15</text>
<rect x="130" y="322" width="390" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="142" y="340" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >AEL_HUD_VIDEO_V1 (assinatura)</text>
<rect x="40" y="352" width="90" height="26" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
<text x="85" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4500" >16–31</text>
<rect x="130" y="352" width="390" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="142" y="370" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >os mesmos bytes invertidos</text>
<rect x="40" y="382" width="90" height="26" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
<text x="85" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4500" >32–35</text>
<rect x="130" y="382" width="390" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="142" y="400" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >largura 320 e altura 240</text>
<rect x="40" y="412" width="90" height="26" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
<text x="85" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4500" >36–39</text>
<rect x="130" y="412" width="390" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="142" y="430" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >número de quadros</text>
<rect x="40" y="442" width="90" height="26" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
<text x="85" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4500" >40–41</text>
<rect x="130" y="442" width="390" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="142" y="460" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >setores por quadro (150)</text>
<rect x="40" y="472" width="90" height="26" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
<text x="85" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4500" >42</text>
<rect x="130" y="472" width="390" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="142" y="490" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >fps</text>
<rect x="40" y="502" width="90" height="26" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
<text x="85" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4500" >43</text>
<rect x="130" y="502" width="390" height="26" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="142" y="520" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >formato (1 = RGB332)</text>
<text x="580" y="300" text-anchor="start" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1">UM QUADRO</text>
<line x1="580" y1="308" x2="1060" y2="308" stroke="#d0d7de" stroke-width="2"/>
<rect x="580" y="322" width="170" height="128" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
<text x="665" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1" >320 × 240 pixels</text>
<text x="665" y="402" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >76 800 bytes = 150 setores</text>
<line x1="755" y1="386" x2="800" y2="386" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<text x="930" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24" >1 byte por pixel (RGB332)</text>
<rect x="800" y="345" width="34" height="34" rx="3" fill="#d1242f" stroke="#ffffff" stroke-width="1.5"/>
<text x="817" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >7</text>
<rect x="834" y="345" width="34" height="34" rx="3" fill="#d1242f" stroke="#ffffff" stroke-width="1.5"/>
<text x="851" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >6</text>
<rect x="868" y="345" width="34" height="34" rx="3" fill="#d1242f" stroke="#ffffff" stroke-width="1.5"/>
<text x="885" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >5</text>
<rect x="902" y="345" width="34" height="34" rx="3" fill="#2e8b3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="919" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >4</text>
<rect x="936" y="345" width="34" height="34" rx="3" fill="#2e8b3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="953" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >3</text>
<rect x="970" y="345" width="34" height="34" rx="3" fill="#2e8b3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="987" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >2</text>
<rect x="1004" y="345" width="34" height="34" rx="3" fill="#1f6feb" stroke="#ffffff" stroke-width="1.5"/>
<text x="1021" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >1</text>
<rect x="1038" y="345" width="34" height="34" rx="3" fill="#1f6feb" stroke="#ffffff" stroke-width="1.5"/>
<text x="1055" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" >0</text>
<text x="851" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#d1242f" >RRR</text>
<text x="953" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#2e8b3a" >GGG</text>
<text x="1029" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6feb" >BB</text>
<text x="930" y="425" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >bits 7…0: vermelho, verde, azul</text>
<text x="930" y="443" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a" >o HUD repete os bits de cima para ir de 0 a 15</text>
<rect x="580" y="470" width="480" height="134" rx="8" fill="#eef9ef" stroke="#2e8b3a" stroke-width="1.5"/>
<text x="820" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20" >Como a FPGA acha o vídeo</text>
<text x="600" y="518" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >1. CMD18: leitura contínua a partir do setor 0</text>
<text x="600" y="538" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >2. confere se o setor começa com AEL_HUD_VIDEO_V1</text>
<text x="600" y="558" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >3. não é? próximo setor (procura até 128 MB)</text>
<text x="600" y="578" text-anchor="start" font-size="12" font-weight="400" fill="#1b1f24" >4. é? lê fps e nº de quadros e começa a tocar</text>
<rect x="40" y="540" width="480" height="64" rx="8" fill="#fff1e0" stroke="#e0720b" stroke-width="1.5"/>
<text x="280" y="562" text-anchor="middle" font-size="12" font-weight="700" fill="#8a4300" >Cartão FAT32 recém-formatado, só com o VIDEO.BIN</text>
<text x="280" y="582" text-anchor="middle" font-size="12" font-weight="400" fill="#8a4300" >assim o arquivo fica em setores seguidos (sem FAT para ler)</text>
</svg>
